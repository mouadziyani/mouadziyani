name: Update profile activity graphs

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: generated-profile-assets
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Test activity graph generator
        run: python -m unittest discover -s scripts -p 'test_*.py' -v

      - name: Preserve existing output branch assets
        shell: bash
        run: |
          mkdir -p dist
          if git ls-remote --exit-code --heads origin output >/dev/null; then
            git fetch --no-tags origin output
            git archive FETCH_HEAD | tar -x -C dist
          fi
      - name: Generate activity graph
        run: python scripts/generate_activity_graph.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Pac-Man contribution graph
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: mouadziyani
          github_token: ${{ secrets.GITHUB_TOKEN }}
          games: pacman
          hide_month_labels: "false"

      - name: Publish generated SVGs to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
